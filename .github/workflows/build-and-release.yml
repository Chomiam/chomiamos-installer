name: 🚀 Build ChomiamOS Installer & Release

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: 🔨 Build Package & Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔍 Check Python Syntax
        run: |
          python -m py_compile src/omnis/main.py src/omnis/gui/bridge.py src/omnis/utils/updater.py src/omnis/jobs/nixos.py

      - name: ❄️ Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: ⚡ Setup Cachix
        uses: cachix/cachix-action@v15
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: chomiamos-installer
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        continue-on-error: true

      - name: 📦 Build Nix Package (Omnis)
        run: |
          nix build --print-build-logs .#omnis

      - name: 🧪 Test Executable Output
        run: |
          ./result/bin/omnis --version
          ./result/bin/omnis --help

      - name: 🗜️ Package Auto-Update Archive
        run: |
          cp ./result/bin/chomiamos-installer ./chomiamos-installer-x86_64 || cp data/bin/chomiamos-installer ./chomiamos-installer-x86_64
          chmod +x ./chomiamos-installer-x86_64
          tar -czf chomiamos-installer-release.tar.gz src config data package.nix pyproject.toml README.md flake.nix
          sha256sum chomiamos-installer-release.tar.gz > chomiamos-installer-release.tar.gz.sha256
          echo "Archive de release générée :"
          ls -lh chomiamos-installer-release.tar.gz* chomiamos-installer-x86_64

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chomiamos-installer-release
          path: |
            chomiamos-installer-release.tar.gz
            chomiamos-installer-release.tar.gz.sha256
            chomiamos-installer-x86_64

  release:
    name: 🚀 Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: chomiamos-installer-release

      - name: 🏷️ Determine Tag Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(PYTHONPATH=src python3 -c "from omnis import __version__; print(__version__)")
            TAG_NAME="v${VERSION}"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: 📢 Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "ChomiamOS Installer ${{ steps.tag_info.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            chomiamos-installer-release.tar.gz
            chomiamos-installer-release.tar.gz.sha256
            chomiamos-installer-x86_64
