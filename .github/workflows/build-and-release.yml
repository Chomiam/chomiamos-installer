name: 🚀 Build ChomiamOS Installer & Release

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🔨 Build Rust/Tauri Installer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── Vérifications syntaxiques rapides ──
      - name: 🔍 Validate Frontend (HTML/JS/CSS)
        run: |
          echo "=== Vérification de la présence des fichiers frontend ==="
          test -f frontend/index.html   && echo "✅ index.html"
          test -f frontend/js/app.js    && echo "✅ app.js"
          test -f frontend/css/style.css && echo "✅ style.css"
          echo "=== Vérification syntaxe JS (node --check) ==="
          if command -v node &>/dev/null; then
            node --check frontend/js/app.js && echo "✅ app.js syntax OK"
          else
            echo "⚠️  Node.js non disponible, skip JS syntax check"
          fi

      - name: 🦀 Validate Rust source structure
        run: |
          echo "=== Vérification de la structure Cargo/Tauri ==="
          test -f src-tauri/Cargo.toml     && echo "✅ Cargo.toml"
          test -f src-tauri/tauri.conf.json && echo "✅ tauri.conf.json"
          test -f src-tauri/src/main.rs     && echo "✅ main.rs"
          test -f src-tauri/src/install.rs  && echo "✅ install.rs"
          test -f Cargo.lock               && echo "✅ Cargo.lock"
          test -f package.nix              && echo "✅ package.nix"
          test -f flake.nix                && echo "✅ flake.nix"
          # Extraction de la version depuis Cargo.toml
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "📦 Version détectée : $VERSION"
          echo "INSTALLER_VERSION=$VERSION" >> $GITHUB_ENV

      # ── Installation Nix avec Flakes ──
      - name: ❄️ Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: ⚡ Setup Cachix
        uses: cachix/cachix-action@v15
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: chomiamos-installer
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        continue-on-error: true

      # ── Build du paquet Rust via Nix ──
      - name: 📦 Build ChomiamOS Installer (Nix + Rust/Tauri)
        run: |
          echo "🔨 Construction du paquet chomiamos-installer v$INSTALLER_VERSION via Nix..."
          nix build --print-build-logs .#omnis
          echo "✅ Build terminé avec succès"

      - name: 🧪 Test Executable
        run: |
          echo "=== Test du binaire compilé ==="
          ls -la result/bin/
          ./result/bin/chomiamos-installer --version
          ./result/bin/chomiamos-installer --help
          echo "✅ Binaire fonctionnel"

      # ── Packaging des assets de release ──
      - name: 🗜️ Package Release Assets
        run: |
          echo "=== Préparation des assets de release ==="
          # Binaire natif standalone : extraire le vrai exécutable ELF généré par Nix/Tauri
          if [ -f ./result/bin/.chomiamos-installer-wrapped_ ]; then
            echo "📦 Copie du binaire ELF natif (.chomiamos-installer-wrapped_)..."
            cp ./result/bin/.chomiamos-installer-wrapped_ ./chomiamos-installer-x86_64
          else
            echo "📦 Copie du binaire direct chomiamos-installer..."
            cp ./result/bin/chomiamos-installer ./chomiamos-installer-x86_64
          fi
          chmod +x ./chomiamos-installer-x86_64

          # Archive complète pour le système de mise à jour
          tar -czf chomiamos-installer-release.tar.gz \
            src-tauri/ \
            frontend/ \
            config/ \
            package.nix \
            flake.nix \
            flake.lock \
            Cargo.toml \
            Cargo.lock \
            README.md \
            LICENSE

          sha256sum chomiamos-installer-release.tar.gz > chomiamos-installer-release.tar.gz.sha256
          sha256sum chomiamos-installer-x86_64 > chomiamos-installer-x86_64.sha256

          echo "📦 Assets générés :"
          ls -lh chomiamos-installer-release.tar.gz* chomiamos-installer-x86_64*

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chomiamos-installer-v${{ env.INSTALLER_VERSION }}
          path: |
            chomiamos-installer-release.tar.gz
            chomiamos-installer-release.tar.gz.sha256
            chomiamos-installer-x86_64
            chomiamos-installer-x86_64.sha256

  # ── Release GitHub automatique sur tag v* ──
  release:
    name: 🚀 Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Determine Version & Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
            TAG_NAME="v${VERSION}"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "🏷️ Release tag: ${TAG_NAME}"

      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: chomiamos-installer-*
          merge-multiple: true

      - name: 📢 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "ChomiamOS Installer ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            chomiamos-installer-release.tar.gz
            chomiamos-installer-release.tar.gz.sha256
            chomiamos-installer-x86_64
            chomiamos-installer-x86_64.sha256
