  install_button: "Installer ChomiamOS"

  progress_partitioning: "Partitionnement du disque cible..."
  progress_installing: "Déploiement de ChomiamOS..."
  progress_configuring: "Configuration matérielle et compte..."
  progress_bootloader: "Installation du bootloader ChomiamOS..."

  finished_title: "Installation terminée !"
  finished_message: "ChomiamOS a été installé avec succès sur votre machine. Redémarrez dès maintenant pour profiter de votre nouveau système."
  reboot_button: "Redémarrer maintenant"

  error_generic: "Une erreur est survenue lors de l'installation"
  error_disk_space: "Espace disque insuffisant"
  error_network: "Connexion réseau requise pour cloner le framework"
