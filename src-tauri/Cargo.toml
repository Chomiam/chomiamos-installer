[package]
name = "chomiamos-installer"
version = "1.2.15"
edition = "2021"

[dependencies]
tauri = { version = "2.3", features = [] }
sysinfo = "0.33"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
nix = { version = "0.29", features = ["fs"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
